---
layout: default
title: Our Team
---

<div class="mb-8">
    <h1 class="text-4xl font-bold text-vu-blue mb-2">Researchers & PhD Candidates</h1>
    <p class="text-gray-600 text-lg">The brilliant minds executing our day-to-side research.</p>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    {% for member in site.team %}
    <div class="bg-white rounded shadow p-5 border-l-4 border-vu-blue">
        <h2 class="text-lg font-bold text-gray-800">{{ member.title }}</h2>
        <p class="text-sm font-semibold text-gray-500 mb-2">{{ member.role }}</p>
        <p class="text-xs text-gray-400 mb-3">Advisor: {{ member.advisor }}</p>
        
        <div class="text-gray-600 text-sm mb-4 line-clamp-3">
            {{ member.content | markdownify | strip_html }}
        </div>
        
        <a href="mailto:{{ member.email }}" class="text-vu-blue hover:underline text-sm font-medium">Contact</a>
    </div>
    {% endfor %}
</div>
