<!-- 2. DYNAMIC NEWS SHOWREEL (Image Slider) -->
<div class="max-w-7xl mx-auto px-4 py-16">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-3xl font-bold text-gray-900">Latest News</h2>
        <div class="h-1 flex-grow bg-gray-200 ml-6 rounded-full">
            <div class="w-24 h-1 bg-vu-blue rounded-full"></div>
        </div>
    </div>

    <!-- The Carousel Container -->
    <div class="relative w-full h-[400px] rounded-2xl overflow-hidden shadow-2xl bg-gray-900" id="news-carousel">
        
        <!-- Jekyll Loop: Sort news by date (newest first) -->
        {% assign sorted_news = site.news | sort: 'date' | reverse %}
        {% for item in sorted_news %}
        
        <!-- Each Slide -->
        <div class="carousel-slide absolute inset-0 transition-opacity duration-1000 ease-in-out {% if forloop.first %}opacity-100 z-10{% else %}opacity-0 z-0{% endif %}">
            
            <!-- Background Image (Cropped perfectly with object-cover) -->
            <img src="{{ item.image }}" alt="{{ item.title }}" class="absolute inset-0 w-full h-full object-cover">
            
            <!-- Dark Gradient Overlay so text is always readable -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
            
            <!-- Text Overlay Container -->
            <div class="absolute bottom-0 left-0 p-8 md:p-12 w-full">
                <span class="bg-vu-blue text-white text-xs font-bold uppercase px-3 py-1 rounded-full mb-4 inline-block">
                    {{ item.date | date: "%B %d, %Y" }}
                </span>
                <h3 class="text-3xl md:text-4xl font-bold text-white mb-3 shadow-sm leading-tight">
                    {{ item.title }}
                </h3>
                <p class="text-gray-200 line-clamp-2 md:w-2/3 text-lg">
                    {{ item.content | strip_html }}
                </p>
            </div>
        </div>
        {% endfor %}
        
    </div>
</div>

<!-- JavaScript for Cross-Fading the Dynamic Slides -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const slides = document.querySelectorAll('.carousel-slide');
        if(slides.length <= 1) return; // Don't animate if there's only 0 or 1 news item
        
        let currentIndex = 0;

        setInterval(() => {
            // Fade out current slide
            slides[currentIndex].classList.remove('opacity-100', 'z-10');
            slides[currentIndex].classList.add('opacity-0', 'z-0');
            
            // Calculate next slide index
            currentIndex = (currentIndex + 1) % slides.length;
            
            // Fade in next slide
            slides[currentIndex].classList.remove('opacity-0', 'z-0');
            slides[currentIndex].classList.add('opacity-100', 'z-10');
        }, 6000); // Rotates every 6 seconds
    });
</script>
