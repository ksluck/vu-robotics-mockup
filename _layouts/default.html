<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <!-- Tailwind CSS for instant, beautiful styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* VU Amsterdam Official Colors */
        .text-vu-blue { color: #0077b3; }
        .bg-vu-blue { background-color: #0077b3; }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-gray-50 text-gray-800">

    <!-- Navigation Bar -->
    <nav class="bg-vu-blue text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="{{ '/' | relative_url }}" class="text-xl font-bold">VU Robotics</a>
            <div class="space-x-4">
                <a href="{{ '/faculty.html' | relative_url }}" class="hover:text-blue-200">Faculty</a>
                <a href="{{ '/team.html' | relative_url }}" class="hover:text-blue-200">Team</a>
                <a href="{{ '/projects.html' | relative_url }}" class="hover:text-blue-200">Projects</a>
                <a href="{{ '/teaching.html' | relative_url }}" class="hover:text-blue-200">Teaching</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full">
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-6 mt-8">
        <p>&copy; 2026 {{ site.title }}. Vrije Universiteit Amsterdam.</p>
    </footer>

</body>
</html>
